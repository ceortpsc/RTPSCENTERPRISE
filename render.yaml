services:
  - type: web
    name: rtpsc-web
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: DATABASE_URL
        fromDatabase:
          name: rtpsc-postgres
          property: connectionString

  - type: web
    name: rtpsc-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install --no-audit --no-fund
    startCommand: node server/index.mjs
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: DATABASE_URL
        fromDatabase:
          name: rtpsc-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: rtpsc-postgres
    plan: 0.5c-1g
    databaseName: rtpsc
    user: rtpsc_app
