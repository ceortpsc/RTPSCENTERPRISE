name: ComeauxClinical
options:
  bundleIdPrefix: com.comeauxclinical
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  ComeauxClinical:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ComeauxClinical
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.comeauxclinical.mobile
        PRODUCT_NAME: Comeaux Clinical
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Comeaux Clinical
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
schemes:
  ComeauxClinical:
    build:
      targets:
        ComeauxClinical: all
    run:
      config: Debug
    archive:
      config: Release
